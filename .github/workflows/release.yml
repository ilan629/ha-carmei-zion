name: Release

# Push a tag like v1.2.0 and this publishes the GitHub release that HACS offers
# to everyone as an update. Commits without a tag are never offered.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest.json version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c 'import json;print(json.load(open("custom_components/carmei_zion/manifest.json"))["version"])')"
          if [ "$want" != "$have" ]; then echo "Tag $GITHUB_REF_NAME but manifest.json says $have"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests must pass
        run: pip install -r requirements_test.txt && pytest -q
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
